name: Build Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cek kredensial Last.fm sudah dipasang
        run: |
          if [ -z "${{ secrets.LASTFM_API_KEY }}" ] || [ -z "${{ secrets.LASTFM_API_SECRET }}" ]; then
            echo "::error::GitHub Secrets LASTFM_API_KEY / LASTFM_API_SECRET belum diisi."
            echo "Buka: Settings > Secrets and variables > Actions > New repository secret"
            echo "Panduan lengkap: docs/PANDUAN_API_KEY.md"
            exit 1
          fi
          echo "Kredensial ditemukan."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # PENTING: opsi cache: npm di action ini MENSYARATKAN package-lock.json ada dan akan
          # membuat step ini gagal duluan (sebelum sempat mencapai fallback npm install di
          # bawah) kalau lockfile belum di-commit. Dihapus untuk sekarang — build jadi sedikit
          # lebih lambat tanpa cache, tapi tidak gagal total di step pertama. Setelah
          # package-lock.json ada & ter-commit, opsi ini aman ditambahkan kembali.

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json ditemukan, pakai npm ci (reproducible build)"
            npm ci
          else
            echo "::warning::package-lock.json belum ada di repo — pakai npm install sebagai fallback."
            echo "Sebaiknya jalankan 'npm install' sekali secara lokal lalu commit package-lock.json"
            echo "yang dihasilkan, supaya build berikutnya reproducible lewat npm ci."
            npm install
          fi

      - name: Jalankan unit test (logic scrobble murni)
        run: npm test

      - name: Build web assets
        run: npm run build
        env:
          VITE_LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          VITE_LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}

      # Kalau folder android/ belum di-commit, CI membuatnya sendiri. Ini yang memungkinkan
      # seseorang membangun APK TANPA menginstal apa pun di komputernya — cukup lewat GitHub.
      # `cap add android` hanya menyalin template proyek Android (tidak butuh Android SDK; SDK
      # & Gradle disiapkan langkah-langkah berikutnya di runner ini).
      - name: Siapkan folder android/ (buat kalau belum ada)
        run: |
          if [ ! -d "android" ]; then
            echo "Folder android/ belum ada — dibuat otomatis oleh CI."
            npx cap add android
          else
            echo "Folder android/ sudah ada di repo."
          fi

      # Salin file native kustom Scrola (Kotlin, manifest, resource) ke dalam android/.
      # WAJIB dijalankan SETELAH android/ ada dan SEBELUM cap sync + gradle build.
      - name: Terapkan overlay native Scrola
        run: npm run native:overlay

      - name: Sync Capacitor (update aset web + plugin di android/)
        run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Pastikan gradlew bisa dieksekusi
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: android
        # Jangan pipe ke `tail`: tanpa pipefail, kegagalan Gradle tertutup dan job
        # baru gagal belakangan saat upload karena file APK tidak ditemukan.
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Verifikasi hasil APK
        run: |
          set -euxo pipefail
          find android/app/build/outputs -type f -name '*.apk' -print
          test -n "$(find android/app/build/outputs -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scrola-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publikasikan APK ke Release "latest" -> tautan unduh LANGSUNG yang stabil:
      #   https://github.com/<owner>/Scrola/releases/latest
      # Jadi cukup upload/commit -> tunggu CI hijau -> unduh APK dari halaman Releases.
      - name: Publikasikan APK ke Release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          gh release delete latest -y --cleanup-tag 2>/dev/null || true
          gh release create latest "$APK" \
            --title "Scrola APK (debug) — build terbaru" \
            --notes "Build otomatis dari commit ${{ github.sha }}. Pasang di Android (izinkan sumber tak dikenal)." \
            --prerelease
